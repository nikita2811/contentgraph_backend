version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    command: gunicorn contentgraph_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  celery_worker:
    
    build: . 
    restart: always
    command: celery -A contentgraph_backend worker --loglevel=info --pool=gevent --concurrency=100 -Q default,csv
    env_file: .env 
    depends_on:
      - web
      - db

volumes:
  postgres_data:
